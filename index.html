<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer | Day 13</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="timer-card">
        <p class="tag">✨Count Down to Something Extraordinary✨</p>
        <h1>Countdown Timer ⏳</h1>
        <p class="subtitle">
            Every second brings you closer to something amazing!
        </p>
        <label for="targetDate">Choose your special date:</label>
        <input type="datetime-local" id="targetDate">
        <button id="startBtn">Start Countdown 🚀</button>
        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <p>Days</p>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <p>Hours</p>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <p>Minutes</p>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <p>Seconds</p>
            </div>
        </div>
        <p id="message">Pick a date and let the magic begin! 💖</p>
        <p class="footer">Made with 💗 by Tharuni</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
